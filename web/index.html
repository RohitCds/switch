<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f8f7f4" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0b0d11" media="(prefers-color-scheme: dark)" />
    <meta name="description" content="A focused MLE interview study companion." />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Switch" />
    <meta name="format-detection" content="telephone=no" />
    <link rel="manifest" href="manifest.webmanifest?v=4" />
    <link rel="apple-touch-icon" sizes="1024x1024" href="apple-touch-icon.png?v=4" />
    <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png?v=4" />
    <link rel="icon" type="image/png" sizes="1024x1024" href="icon-1024.png?v=4" />
    <link rel="stylesheet" href="styles.css?v=6" />
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar" id="sidebar" aria-label="Course navigation">
        <div class="brand">
          <div class="brand-mark" aria-hidden="true">S</div>
          <div>
            <p class="eyebrow">INTERVIEW PREP</p>
            <h1>Switch</h1>
          </div>
          <button class="icon-button sidebar-close" id="close-sidebar" aria-label="Close course navigation">×</button>
        </div>
        <div class="library-tabs" role="tablist" aria-label="Library">
          <button role="tab" data-library="core" aria-selected="true">Core</button>
          <button role="tab" data-library="tracks" aria-selected="false">Tracks</button>
          <button role="tab" data-library="roles" aria-selected="false">Roles</button>
        </div>
        <div class="course-summary" id="course-summary"></div>
        <nav class="day-list" id="day-list" aria-label="Library"></nav>

        <div class="reader-controls" role="group" aria-label="Reading preferences">
          <p class="eyebrow">Reading</p>
          <div class="reader-row">
            <span class="reader-label">Text size</span>
            <div class="seg" role="group" aria-label="Text size">
              <button data-text-size="s" aria-label="Small text">S</button>
              <button data-text-size="m" aria-label="Medium text">M</button>
              <button data-text-size="l" aria-label="Large text">L</button>
            </div>
          </div>
          <button class="reader-toggle" id="toggle-focus" aria-pressed="false">
            <span>Focus mode</span><span class="switch" aria-hidden="true"></span>
          </button>
          <button class="reader-toggle" id="toggle-primers" aria-pressed="true">
            <span>Show primers</span><span class="switch" aria-hidden="true"></span>
          </button>
          <button class="reader-lock" id="auth-lock">Lock workspace</button>
        </div>
      </aside>

      <main class="main-content">
        <header class="topbar">
          <button class="icon-button menu-button" id="open-sidebar" aria-label="Open course navigation">☰</button>
          <div class="topbar-copy">
            <p class="eyebrow" id="topbar-label">LOADING COURSE</p>
            <p class="topbar-title" id="topbar-title">Preparing your study space…</p>
          </div>
          <div class="topbar-actions">
            <button class="icon-button" id="open-search" aria-label="Search all cards" title="Search all cards (press /)">⌕</button>
            <button class="icon-button" id="theme-toggle" aria-label="Switch color theme" title="Switch color theme">◐</button>
          </div>
        </header>

        <div class="workspace" id="workspace" aria-live="polite">
          <div class="loading-state">
            <div class="loader" aria-hidden="true"></div>
            <p>Loading your study material…</p>
          </div>
        </div>

        <nav class="tabbar" id="tabbar" aria-label="Study mode">
          <button class="tab" data-mode="learn" aria-label="Learn">
            <span class="tab-icon" aria-hidden="true">📖</span><span class="tab-label">Learn</span>
          </button>
          <button class="tab" data-mode="drill" aria-label="Drill">
            <span class="tab-icon" aria-hidden="true">⚡️</span><span class="tab-label">Drill</span>
          </button>
          <button class="tab" data-mode="review" aria-label="Review">
            <span class="tab-icon" aria-hidden="true">🔁</span><span class="tab-label">Review</span>
            <span class="tab-badge" id="review-badge" hidden>0</span>
          </button>
          <button class="tab" data-mode="overview" aria-label="Notes">
            <span class="tab-icon" aria-hidden="true">🗒️</span><span class="tab-label">Notes</span>
          </button>
        </nav>
      </main>
    </div>
    <div class="sidebar-backdrop" id="sidebar-backdrop"></div>

    <div class="search-overlay" id="search-overlay" hidden>
      <div class="search-panel" role="dialog" aria-modal="true" aria-label="Search all cards">
        <div class="search-field">
          <span aria-hidden="true">⌕</span>
          <input type="search" id="global-search" placeholder="Search all cards…" autocomplete="off"
                 autocapitalize="none" autocorrect="off" spellcheck="false" aria-label="Search all cards" />
          <button class="icon-button search-close" id="close-search" aria-label="Close search">×</button>
        </div>
        <div class="search-results" id="search-results"></div>
      </div>
    </div>

    <div class="auth-overlay" id="auth-overlay" hidden>
      <div class="auth-card">
        <div class="brand">
          <div class="brand-mark" aria-hidden="true">S</div>
          <div>
            <p class="eyebrow">PRIVATE ACCESS</p>
            <h1>Switch</h1>
          </div>
        </div>
        <h2>Sign in to Study</h2>
        <p class="subtitle">Enter your credentials to unlock your curriculum.</p>
        <form class="auth-form" id="auth-form">
          <div class="auth-field">
            <label for="auth-username">Username</label>
            <input type="text" id="auth-username" autocomplete="username" autocapitalize="none" autocorrect="off" spellcheck="false" required placeholder="Enter username" />
          </div>
          <div class="auth-field">
            <label for="auth-password">Password</label>
            <input type="password" id="auth-password" autocomplete="current-password" required placeholder="Enter password" />
          </div>
          <div class="auth-options">
            <label>
              <input type="checkbox" id="auth-remember" checked />
              <span>Remember me</span>
            </label>
          </div>
          <div class="auth-error" id="auth-error" hidden>Invalid username or password</div>
          <button type="submit" class="auth-submit">Unlock Workspace</button>
        </form>
      </div>
    </div>

    <script src="app.js?v=6"></script>
  </body>
</html>
